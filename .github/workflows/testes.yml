# roda os testes da API a cada push e pull request
# os testes usam o H2 em memória (src/test/resources/application.yaml), ent n precisam do neon nem de segredo
name: Testes da API

on:
  push:
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: schoolsync-api

    steps:
      - uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: schoolsync-api/pom.xml

      - name: Rodar os testes
        run: |
          chmod +x mvnw
          ./mvnw -B test
