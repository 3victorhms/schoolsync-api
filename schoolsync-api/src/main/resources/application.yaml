spring:
  application:
    name: schoolsync-api

  datasource:
    url: ${DATASOURCE_URL:jdbc:mysql://localhost:3306/schoolsync}
    username: ${DATASOURCE_USER:root}
    password: ${DATASOURCE_PWD:}
    driver-class-name: ${DATASOURCE_DRIVER:com.mysql.cj.jdbc.Driver}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

jwt:
  secret: ${JWT_SECRET:schoolsync-dev-secret-key-change-me-with-at-least-32-chars}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}
