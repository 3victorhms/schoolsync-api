spring:
  application:
    name: schoolsync-api

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://ep-dark-firefly-ac5fljc3-pooler.sa-east-1.aws.neon.tech/neondb?sslmode=require}
    username: ${DATABASE_USER}
    password: ${DATABASE_PASSWORD}
    driver-class-name: ${DATASOURCE_DRIVER:org.postgresql.Driver}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: ${SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: ${SHOW_SQL:false}

server:
  error:
    include-message: always
    include-binding-errors: always

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

firebase:
  enabled: ${FIREBASE_ENABLED:false}
  project-id: ${FIREBASE_PROJECT_ID:}
  credentials-base64: ${FIREBASE_CREDENTIALS_BASE64:}

# recuperação de senha. o e-mail sai pela API da brevo pq o render grátis bloqueia SMTP.
# sem BREVO_API_KEY e EMAIL_REMETENTE a rota responde 503 e o resto funciona normal
recuperacao-senha:
  brevo-api-key: ${BREVO_API_KEY:}
  remetente-email: ${EMAIL_REMETENTE:}
  remetente-nome: ${EMAIL_REMETENTE_NOME:SchoolSync}
  validade-minutos: ${RECUPERACAO_SENHA_VALIDADE_MINUTOS:15}

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:}
  api-key: ${CLOUDINARY_API_KEY:}
  api-secret: ${CLOUDINARY_API_SECRET:}

# login com google: client id "Aplicativo da Web" criado no Google Cloud (o mesmo do app).
# dá pra colocar mais de um separado por vírgula. sem ele a rota /usuarios/google responde 503
google:
  client-ids: ${GOOGLE_CLIENT_IDS:}
