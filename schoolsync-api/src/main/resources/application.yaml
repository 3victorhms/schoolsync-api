spring:
  application:
    name: schoolsync-api

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

  datasource:
    url: ${DATASOURCE_URL:jdbc:postgresql://ep-dark-firefly-ac5fljc3-pooler.sa-east-1.aws.neon.tech/neondb?sslmode=require}
    username: ${DATASOURCE_USER:neondb_owner}
    password: ${DATASOURCE_PWD:npg_KVcDIr4Was1u}
    driver-class-name: ${DATASOURCE_DRIVER:org.postgresql.Driver}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

jwt:
  secret: ${JWT_SECRET:schoolsync-dev-secret-key-change-me-with-at-least-32-chars}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

firebase:
  enabled: ${FIREBASE_ENABLED:false}
  project-id: ${FIREBASE_PROJECT_ID:}
  credentials-base64: ${FIREBASE_CREDENTIALS_BASE64:}

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:}
  api-key: ${CLOUDINARY_API_KEY:}
  api-secret: ${CLOUDINARY_API_SECRET:}
