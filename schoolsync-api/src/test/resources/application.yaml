spring:
  datasource:
    url: jdbc:h2:mem:schoolsync-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false

jwt:
  secret: schoolsync-test-secret-key-with-at-least-32-characters
  expiration-ms: 86400000
